<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Клієнти">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<title>Клієнти та нагадування</title>
<style>
:root { --primary:#2563eb; --bg:#f3f4f6; --text:#111827; --muted:#6b7280; --border:#e5e7eb; --danger:#ef4444; }
* { box-sizing:border-box; }
body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); padding:12px; }
.header { margin-bottom:12px; }
.header h1 { margin:0 0 10px; font-size:22px; }
.header-buttons { display:flex; flex-wrap:wrap; gap:6px; }
button { background:var(--primary); color:#fff; border:none; border-radius:8px; padding:10px 12px; font-size:14px; cursor:pointer; }
.btn-small { padding:6px 10px; font-size:13px; }
.btn-secondary { background:#e5e7eb; color:var(--text); }
.btn-danger { background:var(--danger); }
.tabs { display:flex; gap:4px; margin-bottom:12px; background:#fff; padding:4px; border-radius:12px; }
.tab { flex:1; text-align:center; padding:10px 4px; border-radius:8px; cursor:pointer; font-weight:500; color:var(--muted); font-size:13px; }
.tab.active { background:var(--primary); color:#fff; }
.tab-content { display:none; }
.tab-content.active { display:block; }
.card { background:#fff; border-radius:14px; padding:14px; margin-bottom:10px; box-shadow:0 1px 4px rgba(0,0,0,.06); border:1px solid #f3f4f6; }
.client-name { font-weight:600; font-size:16px; }
.popular { font-size:13px; color:var(--muted); margin:4px 0; }
.modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:100; align-items:center; justify-content:center; padding:12px; }
.modal.show { display:flex !important; }
.modal-content { background:#fff; border-radius:16px; width:100%; max-width:480px; max-height:90vh; overflow-y:auto; padding:16px; }
input, textarea, select { width:100%; padding:10px; border:1px solid var(--border); border-radius:8px; font-size:15px; margin-top:4px; }
.form-group { margin-bottom:12px; }
label { font-size:14px; font-weight:500; }
.search-wrap { position:relative; margin-bottom:10px; }
.search-wrap input { margin-bottom:0; padding-right:36px; }
.search-clear { position:absolute; right:8px; top:50%; transform:translateY(-50%); background:none; border:none; color:#9ca3af; font-size:18px; cursor:pointer; padding:4px; width:28px; height:28px; }
.clients-list, .reminders-list { display:flex; flex-direction:column; gap:8px; }
.reminder-item { background:#fff; border-radius:14px; padding:14px; border:1px solid #e5e7eb; position:relative; box-shadow:0 1px 4px rgba(0,0,0,.04); }
.reminder-item.done { opacity:0.75; background:#f0fdf4; border-color:#bbf7d0; }
.reminder-item.done .txt { text-decoration:line-through; color:#6b7280; }
.check { 
  width: 28px; 
  height: 28px; 
  border-radius: 50%; 
  border: 2px solid #d1d5db; 
  background: #fff; 
  cursor: pointer; 
  font-size: 15px; 
  display: flex; 
  align-items: center; 
  justify-content: center; 
  transition: all .15s;
  flex-shrink: 0;
}
.check:active { transform: scale(0.9); }
.reminder-item.done .check { 
  background: #10b981; 
  border-color: #10b981; 
  color: #fff; 
  box-shadow: 0 0 0 4px rgba(16,185,129,.12); 
}
.menu-btn { 
  background: #f3f4f6; 
  border: none; 
  font-size: 18px; 
  cursor: pointer; 
  color: #6b7280; 
  width: 32px; 
  height: 32px; 
  border-radius: 8px; 
  display: flex; 
  align-items: center; 
  justify-content: center;
}
.menu-btn:active { background: #e5e7eb; }
.menu { 
  display: none; 
  position: absolute; 
  right: 12px; 
  top: 48px; 
  background: #fff; 
  border: 1px solid #e5e7eb; 
  border-radius: 10px; 
  box-shadow: 0 6px 20px rgba(0,0,0,.12); 
  z-index: 10; 
  min-width: 150px; 
  overflow: hidden;
}
.menu.show { display: block; }
.menu button { 
  display: block; 
  width: 100%; 
  text-align: left; 
  background: none; 
  color: #111827; 
  padding: 12px 16px; 
  font-size: 15px;
  border-bottom: 1px solid #f3f4f6;
}
.menu button:last-child { border-bottom: none; }
.menu button:active { background: #f9fafb; }
.menu { display:none; position:absolute; right:8px; top:32px; background:#fff; border:1px solid var(--border); border-radius:8px; box-shadow:0 4px 12px rgba(0,0,0,.1); z-index:5; min-width:130px; }
.menu.show { display:block; }
.menu button { display:block; width:100%; text-align:left; background:none; color:var(--text); padding:8px 12px; }
.today-box { background:linear-gradient(135deg,#2563eb,#1d4ed8); color:#fff; border-radius:16px; padding:14px; }
.today-box .card { background:rgba(255,255,255,.15); color:#fff; }
.empty { text-align:center; color:var(--muted); padding:20px; }
</style>
</head>
<body>

<div class="header">
  <h1>Клієнти</h1>
  <div class="header-buttons">
    <button onclick="openAddClient()">+ Клієнт</button>
    <button onclick="openAddReminder()">+ Нагадування</button>
  </div>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('route')">Маршрут сьогодні</div>
  <div class="tab" onclick="switchTab('clients')">Усі клієнти</div>
  <div class="tab" onclick="switchTab('reminders')">Усі нагадування</div>
</div>

<div id="tab-route" class="tab-content active">
  <div style="margin-bottom:8px;display:flex;gap:6px;flex-wrap:wrap;">
    <button class="btn-small" onclick="setRouteView('all')">Усі клієнти</button>
    <button class="btn-small" onclick="setRouteView('rems')">Нагадування</button>
    <button class="btn-small" onclick="setRouteView('phone')">Тел. продажі</button>
    <button class="btn-small" onclick="setRouteView('b2b')">B2B</button>
  </div>
  <div class="search-wrap">
    <input class="search-box" id="routeSearch" placeholder="Пошук у маршруті..." oninput="renderToday()">
    <button class="search-clear" onclick="document.getElementById('routeSearch').value=''; renderToday();">×</button>
  </div>
  <div id="todayBox" class="today-box"></div>
  <button class="btn-small btn-secondary" style="margin-top:12px;" onclick="if(confirm('Очистити пошук маршруту?')) { document.getElementById('routeSearch').value=''; renderToday(); }">Скинути пошук</button>
</div>

<div id="tab-clients" class="tab-content">
  <div style="margin-bottom:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;">
    <button class="btn-small" onclick="setFilter('all')">Усі</button>
    <button class="btn-small" onclick="setFilter('1')">Пн</button>
    <button class="btn-small" onclick="setFilter('2')">Вт</button>
    <button class="btn-small" onclick="setFilter('3')">Ср</button>
    <button class="btn-small" onclick="setFilter('4')">Чт</button>
    <button class="btn-small" onclick="setFilter('5')">Пт</button>
    <button class="btn-small" onclick="setFilter('phone')">Тел. продажі</button>
    <button class="btn-small" onclick="setFilter('b2b')">B2B</button>
    <button class="btn-small btn-secondary" id="collapseBtn" onclick="toggleCollapse()">Згорнути</button>
  </div>
  <div class="search-wrap">
    <input class="search-box" id="search" placeholder="Пошук клієнтів..." oninput="renderClients()">
    <button class="search-clear" onclick="document.getElementById('search').value=''; renderClients();">×</button>
  </div>
  <div id="clientsList" class="clients-list"></div>
  <button class="btn-small btn-secondary" style="margin-top:12px;" onclick="if(confirm('Очистити пошук і фільтри?')) { document.getElementById('search').value=''; setFilter('all'); }">Скинути фільтри</button>
</div>

<div id="tab-reminders" class="tab-content">
  <div style="margin-bottom:10px;display:flex;flex-wrap:wrap;gap:6px;">
    <select id="period" onchange="renderAllRems()" style="flex:1;min-width:110px;">
      <option value="all">Усі</option>
      <option value="today">Сьогодні</option>
      <option value="week">Цей тиждень</option>
      <option value="month">Цей місяць</option>
    </select>
    <input type="date" id="filterDate" onchange="renderAllRems()" style="flex:1;min-width:130px;">
  </div>
  <div id="allRems" class="reminders-list"></div>
  <button class="btn-small btn-secondary" style="margin-top:12px;" onclick="if(confirm('Очистити фільтри нагадувань?')) { document.getElementById('period').value='all'; document.getElementById('filterDate').value=''; renderAllRems(); }">Скинути фільтри</button>
</div>

<!-- Add Reminder -->
<div class="modal" id="addModal">

    <h2>Нове нагадування</h2>
    <div class="form-group">
      <label>Клієнт</label>
      <input id="clientSearch" placeholder="Пошук..." oninput="filterPick()">
      <div id="pickList" style="max-height:180px;overflow:auto;border:1px solid #e5e7eb;border-radius:8px;margin-top:6px;"></div>
    </div>
    <div id="remForm" style="display:none;">
      <p><b>Клієнт:</b> <span id="selName"></span></p>
      <div class="form-group">
        <label>Категорія</label>
        <select id="catSelect" onchange="onCategoryChange()">
          <option value="">— Оберіть категорію —</option>
          <option value="akb_auto">Акумулятори — Автомобільні</option>
          <option value="akb_moto">Акумулятори — Мото</option>
          <option value="akb_stationary">Акумулятори — Стаціонарні / Тягові</option>
          <option value="akb_truck">Акумулятори — Вантажні</option>
          <option value="oil_motor">Оливи — Автомобільні моторні</option>
          <option value="oil_trans">Оливи — Трансмісійні</option>
          <option value="oil_industrial">Оливи — Промислові</option>
          <option value="oil_moto">Оливи — Для мото техніки</option>
          <option value="oil_flush">Оливи — Промивні</option>
          <option value="oil_commercial">Оливи — Для комерційного транспорту</option>
          <option value="oil_generator">Оливи — Для генераторів</option>
          <option value="antifreeze">Автохімія — Антифризи</option>
          <option value="washer">Автохімія — Омивачі</option>
          <option value="acc_brushes">Аксесуари — Щітки</option>
          <option value="acc_wipers">Аксесуари — Щітки склоочисника</option>
          <option value="acc_compressor">Аксесуари — Компресори / Насоси</option>
          <option value="acc_jack">Аксесуари — Домкрати</option>
          <option value="acc_seat">Аксесуари — Автокрісла</option>
          <option value="acc_washer">Аксесуари — Мийки високого тиску</option>
          <option value="acc_frame">Аксесуари — Рамки номерного знака</option>
          <option value="other">Інше (вручну)</option>
        </select>
      </div>
      <div id="filtersBox" style="display:none;margin-bottom:12px;"></div>
      <div class="form-group"><label>Товар</label><input id="prod" placeholder="або введіть вручну"></div>
      <div class="form-group"><label>Дата</label><input type="date" id="rdate"></div>
      <div class="form-group"><label>Примітка</label><textarea id="rnote"></textarea></div>
      <button onclick="saveRem()">Зберегти</button>
    </div>
    <button class="btn-secondary" onclick="closeModals()" style="margin-top:10px;">Закрити</button>
  </div>
</div>

<!-- Edit Client -->
<div class="modal" id="editModal">
  <div class="modal-content">
    <h2>Редагувати клієнта</h2>
    <div class="form-group"><label>Назва</label><input id="eName"></div>
    <div class="form-group"><label>Телефон</label><input id="ePhone"></div>
    <div class="form-group"><label>Теги (через кому)</label><input id="eTags" placeholder="дилер, новий, проблема"></div>
    <button onclick="saveClient()">Зберегти</button>
    <button class="btn-secondary" onclick="closeModals()">Скасувати</button>
  </div>
</div>

<!-- Edit Reminder -->
<div class="modal" id="editRemModal">
  <div class="modal-content">
    <h2>Редагувати нагадування</h2>
    <div class="form-group"><label>Товар</label><input id="erProd"></div>
    <div class="form-group"><label>Дата</label><input type="date" id="erDate"></div>
    <div class="form-group"><label>Примітка</label><textarea id="erNote"></textarea></div>
    <button onclick="updateRem()">Зберегти</button>
    <button class="btn-secondary" onclick="closeModals()">Скасувати</button>
  </div>
</div>

let filter = "all", routeView = "all", collapsed = false;

function load() {
  try {
    const s = localStorage.getItem(KEY);
    if (s) {
      const p = JSON.parse(s);
      if (p.reminders) data.reminders = p.reminders;
      if (p.clients && p.clients.length) data.clients = p.clients;
    }
  } catch(e) {}
}
function save() {
  localStorage.setItem(KEY, JSON.stringify({ reminders: data.reminders, clients: data.clients }));
}
function closeModals() {
  document.querySelectorAll(".modal").forEach(function(m){
    m.classList.remove("show");
    m.style.display = "none";
  });
  document.querySelectorAll(".menu").forEach(function(m){ m.classList.remove("show"); });
}
function switchTab(t) {
  document.querySelectorAll(".tab").forEach(function(x){ x.classList.remove("active"); });
  document.querySelectorAll(".tab-content").forEach(function(x){ x.classList.remove("active"); });
  var btns = document.querySelectorAll(".tab");
  for (var i=0;i<btns.length;i++) {
    if (btns[i].getAttribute("onclick").indexOf("'"+t+"'") >= 0) btns[i].classList.add("active");
  }
  document.getElementById("tab-"+t).classList.add("active");
  if (t==="clients") renderClients();
  if (t==="route") renderToday();
  if (t==="reminders") renderAllRems();
}
function setFilter(v) { filter = v; renderClients(); }
function setRouteView(v) { routeView = v; renderToday(); }
function toggleCollapse() {
  collapsed = !collapsed;
  document.getElementById("clientsList").style.display = collapsed ? "none" : "flex";
  document.getElementById("collapseBtn").textContent = collapsed ? "Розгорнути" : "Згорнути";
}
function renderClients() {
  var q = (document.getElementById("search").value || "").toLowerCase();
  var list = document.getElementById("clientsList");
  list.innerHTML = "";
  var arr = data.clients;
  var dayFilter = null;
  var sectionFilter = null;

  if (filter === "phone" || filter === "b2b") {
    sectionFilter = filter;
  } else if (filter !== "all") {
    dayFilter = filter;
  }

  function getIds(day) {
    if (sectionFilter === "phone") return data.phoneRoutes[day] || data.phoneRoutes[String(day)] || [];
    if (sectionFilter === "b2b") return data.b2bRoutes[day] || data.b2bRoutes[String(day)] || [];
    return data.routes[day] || data.routes[String(day)] || [];
  }

  if (dayFilter) {
    var mainIds = data.routes[dayFilter] || data.routes[String(dayFilter)] || [];
    var phoneIds = data.phoneRoutes[dayFilter] || data.phoneRoutes[String(dayFilter)] || [];
    var b2bIds = data.b2bRoutes[dayFilter] || data.b2bRoutes[String(dayFilter)] || [];
    var allDayIds = mainIds.concat(phoneIds).concat(b2bIds);
    arr = arr.filter(function(c){ return allDayIds.indexOf(c.id) >= 0; });
  } else if (sectionFilter) {
    // show all clients from that section across all days
    var allIds = [];
    ["1","2","3","4","5"].forEach(function(d){
      var ids = sectionFilter === "phone" ? (data.phoneRoutes[d]||[]) : (data.b2bRoutes[d]||[]);
      ids.forEach(function(id){ if (allIds.indexOf(id)<0) allIds.push(id); });
    });
    arr = arr.filter(function(c){ return allIds.indexOf(c.id) >= 0; });
  }

  arr.filter(function(c){ return c.name.toLowerCase().indexOf(q) >= 0; }).forEach(function(c){
    var d = document.createElement("div");
    d.className = "card";
    var tagsHtml = (c.tags && c.tags.length) ? "<div style='margin:4px 0;'>" + c.tags.map(function(t){ return "<span style='display:inline-block;background:#e0e7ff;color:#3730a3;font-size:11px;padding:2px 8px;border-radius:999px;margin-right:4px;'>"+t+"</span>"; }).join("") + "</div>" : "";
    d.innerHTML = "<div class='client-name'>"+c.name+"</div>" + tagsHtml +
      "<div class='popular'>Ходовий: "+(c.popular||"—")+"</div>" +
      "<div style='margin-top:6px;display:flex;gap:4px;flex-wrap:wrap;'>" +
      "<button class='btn-small' onclick=\"openEdit("+c.id+")\">Редагувати</button>" +
      "<button class='btn-small' onclick='openRemFor("+c.id+")'>+ Нагадування</button>" +
      "<button class='btn-small' onclick='viewClientRems("+c.id+")'>Переглянути</button>" +
      "</div>";
    list.appendChild(d);
  });
  if (!list.children.length) list.innerHTML = "<div class='empty'>Немає клієнтів</div>";
}
function openAddReminder() {
  selId = null;
  document.getElementById("remForm").style.display = "none";
  document.getElementById("clientSearch").value = "";
  filterPick();
  document.getElementById("addModal").classList.add("show");
}
function filterPick() {
  var q = (document.getElementById("clientSearch").value || "").toLowerCase();
  var box = document.getElementById("pickList");
  box.innerHTML = "";
  data.clients.filter(function(c){ return c.name.toLowerCase().indexOf(q)>=0; }).slice(0,40).forEach(function(c){
    var d = document.createElement("div");
    d.style.cssText = "padding:8px;cursor:pointer;border-bottom:1px solid #eee;";
    d.textContent = c.name;
    d.onclick = function(){ pick(c.id); };
    box.appendChild(d);
  });
}
function pick(id) {
  selId = id;
  var c = data.clients.filter(function(x){ return x.id===id; })[0];
  document.getElementById("selName").textContent = c ? c.name : "";
  document.getElementById("remForm").style.display = "block";
}
function openRemFor(id) {
  pick(id);
  document.getElementById("addModal").classList.add("show");
}

function onCategoryChange() {
  var cat = document.getElementById("catSelect").value;
  var box = document.getElementById("filtersBox");
  box.innerHTML = "";
  if (!cat || !CATEGORIES[cat]) {
    box.style.display = "none";
    return;
  }
  var filters = CATEGORIES[cat].filters || [];
  if (!filters.length) {
    box.style.display = "none";
    document.getElementById("prod").value = CATEGORIES[cat].name;
    return;
  }
  box.style.display = "block";
  filters.forEach(function(f) {
    var div = document.createElement("div");
    div.className = "form-group";
    var label = document.createElement("label");
    label.textContent = f.label;
    var sel = document.createElement("select");
    sel.id = "f_" + f.key;
    sel.onchange = updateProductFromFilters;
    var opt0 = document.createElement("option");
    opt0.value = "";
    opt0.textContent = "— " + f.label + " —";
    sel.appendChild(opt0);
    f.options.forEach(function(o) {
      var opt = document.createElement("option");
      opt.value = o;
      opt.textContent = o;
      sel.appendChild(opt);
    });
    div.appendChild(label);
    div.appendChild(sel);
    box.appendChild(div);
  });
  updateProductFromFilters();
}

function updateProductFromFilters() {
  var cat = document.getElementById("catSelect").value;
  if (!cat || !CATEGORIES[cat]) return;
  var parts = [CATEGORIES[cat].name];
  CATEGORIES[cat].filters.forEach(function(f) {
    var el = document.getElementById("f_" + f.key);
    if (el && el.value) parts.push(el.value);
  });
  document.getElementById("prod").value = parts.join(" / ");
}

function saveRem() {
  if (!selId) { alert("Обери клієнта"); return; }
  var p = document.getElementById("prod").value.trim();
  var d = document.getElementById("rdate").value;
  if (!p || !d) { alert("Заповни товар і дату"); return; }
  data.reminders.push({ id:Date.now(), clientId:selId, product:p, date:d, note:document.getElementById("rnote").value, completed:false });
  save();
  closeModals();
  renderClients(); renderToday(); renderAllRems();
}

function openEdit(id) {
  alert("Редагую клієнта " + id);
  editId = id;
  var c = null;
  for (var i = 0; i < data.clients.length; i++) {
    if (data.clients[i].id === id) { c = data.clients[i]; break; }
  }
  if (!c) { alert("Не знайдено"); return; }
  var nameEl = document.getElementById("eName");
  var phoneEl = document.getElementById("ePhone");
  var popEl = document.getElementById("ePop");
  var tagsEl = document.getElementById("eTags");
  var modal = document.getElementById("editModal");
  if (nameEl) nameEl.value = c.name || "";
  if (phoneEl) phoneEl.value = c.phone || "";
  if (popEl) popEl.value = c.popular || "";
  if (tagsEl) tagsEl.value = (c.tags || []).join(", ");
  if (modal) {
    modal.style.display = "flex";
    modal.className = "modal show";
  } else {
    alert("Модальне вікно не знайдено");
  }
}
function saveClient() {
  var c = data.clients.filter(function(x){ return x.id===editId; })[0];
  if (!c) return;
  c.name = document.getElementById("eName").value.trim();
  c.phone = document.getElementById("ePhone").value.trim();
  c.popular = document.getElementById("ePop").value.trim();
  var tagsRaw = document.getElementById("eTags").value.trim();
  c.tags = tagsRaw ? tagsRaw.split(",").map(function(t){ return t.trim(); }).filter(Boolean) : [];
  save();
  closeModals();
  renderClients(); renderToday();
}
function openAddClient() {
  editId = null;
  document.getElementById("eName").value = "";
  document.getElementById("ePhone").value = "";
  document.getElementById("ePop").value = "";
  document.getElementById("eTags").value = "";
  document.getElementById("editModal").classList.add("show");
}
function renderToday() {
  var box = document.getElementById("todayBox");
  var day = new Date().getDay() || 7;
  var dayStr = String(day);
  var q = (document.getElementById("routeSearch") && document.getElementById("routeSearch").value || "").toLowerCase().trim();
  box.innerHTML = "<h2 style='margin:0 0 12px;font-size:18px;'>Маршрут сьогодні</h2>";

  function addSection(title, ids, color) {
    if (!ids || !ids.length) return;
    var sec = document.createElement("div");
    sec.style.marginBottom = "16px";
    var list = document.createElement("div");
    var shown = 0;
    ids.forEach(function(id){
      var c = data.clients.filter(function(x){ return x.id===id; })[0];
      if (!c) return;
      if (q && c.name.toLowerCase().indexOf(q) < 0 && (c.tags||[]).join(" ").toLowerCase().indexOf(q) < 0) return;
      var rems = data.reminders.filter(function(r){ return r.clientId===id; });
      if (routeView==="rems" && !rems.length) return;
      shown++;
      var d = document.createElement("div");
      d.className = "card";
      var remTxt = rems.length ? rems.map(function(r){ return "• "+r.date+" — "+r.product; }).join("<br>") : "";
      var tagsHtml = (c.tags && c.tags.length) ? "<div style='margin:4px 0;'>" + c.tags.map(function(t){ return "<span style='display:inline-block;background:#e0e7ff;color:#3730a3;font-size:11px;padding:2px 8px;border-radius:999px;margin-right:4px;'>"+t+"</span>"; }).join("") + "</div>" : "";
      d.innerHTML = "<div class='client-name'>"+c.name+"</div>" + tagsHtml +
        (remTxt ? "<div style='font-size:13px;opacity:.9;margin:4px 0;'>"+remTxt+"</div>" : "") +
        "<div style='margin-top:6px;display:flex;gap:4px;'>" +
        "<button class='btn-small' style='background:#fff;color:#1d4ed8;' onclick='openEdit("+c.id+")'>Редагувати</button>" +
        "<button class='btn-small' style='background:#fff;color:#1d4ed8;' onclick='openRemFor("+c.id+")'>+ Нагадування</button>" +
        "</div>";
      list.appendChild(d);
    });
    if (shown) {
      sec.innerHTML = "<div style='font-weight:600;margin-bottom:6px;color:"+color+";'>"+title+" ("+shown+")</div>";
      sec.appendChild(list);
      box.appendChild(sec);
    }
  }

  if (routeView === "phone") {
    addSection("Тел. продажі", data.phoneRoutes[dayStr] || data.phoneRoutes[day] || [], "#fef3c7");
  } else if (routeView === "b2b") {
    addSection("B2B", data.b2bRoutes[dayStr] || data.b2bRoutes[day] || [], "#dbeafe");
  } else {
    addSection("Основні", data.routes[dayStr] || data.routes[day] || [], "#fff");
    if (routeView === "all") {
      addSection("Тел. продажі", data.phoneRoutes[dayStr] || data.phoneRoutes[day] || [], "#fef3c7");
      addSection("B2B", data.b2bRoutes[dayStr] || data.b2bRoutes[day] || [], "#dbeafe");
    }
  }

  if (box.children.length <= 1) {
    box.innerHTML += "<div style='opacity:.8;padding:10px;'>Немає клієнтів</div>";
  }
}
function renderAllRems() {
  var box = document.getElementById("allRems");
  box.innerHTML = "";
  var period = document.getElementById("period").value;
  var specific = document.getElementById("filterDate").value;
  var now = new Date();
  var items = data.reminders.slice();
  if (specific) items = items.filter(function(r){ return r.date===specific; });
  else if (period==="today") {
    var t = now.toISOString().slice(0,10);
    items = items.filter(function(r){ return r.date===t; });
  } else if (period==="week") {
    var start = new Date(now); start.setDate(now.getDate()-now.getDay()+1);
    var end = new Date(start); end.setDate(start.getDate()+6);
    items = items.filter(function(r){ var d=new Date(r.date); return d>=start && d<=end; });
  } else if (period==="month") {
    items = items.filter(function(r){ var d=new Date(r.date); return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear(); });
  }
  items.sort(function(a,b){ return a.date.localeCompare(b.date); });
  if (!items.length) { box.innerHTML = "<div class='empty'>Нагадувань немає</div>"; return; }
  items.forEach(function(r){
    var c = data.clients.filter(function(x){ return x.id===r.clientId; })[0];
    var d = document.createElement("div");
    d.className = "reminder-item" + (r.completed ? " done" : "");
    d.innerHTML = "<div style='display:flex;justify-content:space-between;align-items:flex-start;'>" +
      "<div class='txt'><div style='font-weight:600;color:#2563eb;'>"+r.date+"</div><b>"+(c?c.name:"")+"</b><br>"+r.product+"</div>" +
      "<button class='check' onclick=\"toggleDone("+r.id+")\">"+(r.completed?"✓":"")+"</button></div>" +
      "<div style='margin-top:8px;display:flex;gap:6px;'>" +
      "<button class='btn-small' onclick=\"editRem("+r.id+")\">Редагувати</button>" +
      "<button class='btn-small' style='background:#ef4444;' onclick=\"delRem("+r.id+")\">Видалити</button>" +
      "</div>";
    box.appendChild(d);
  });
}
function toggleDone(id) {
  var r = data.reminders.filter(function(x){ return x.id===id; })[0];
  if (r) { r.completed = !r.completed; save(); renderAllRems(); renderToday(); }
}
function resetAll() {
  var ok = confirm("Скинути всі дані?");
  if (ok) {
    localStorage.removeItem(KEY);
    location.reload();
  }
}

function delRem(id) {
  data.reminders = data.reminders.filter(function(r){ return r.id !== id; });
  save();
  renderAllRems();
  renderToday();
}

function toggleMenu(id) {
  var menus = document.querySelectorAll(".menu");
  for (var i = 0; i < menus.length; i++) menus[i].classList.remove("show");
  var m = document.getElementById("menu" + id);
  if (m) m.classList.add("show");
}
function editRem(id) {
  editRemId = id;
  var r = data.reminders.filter(function(x){ return x.id===id; })[0];
  if (!r) return;
  document.getElementById("erProd").value = r.product||"";
  document.getElementById("erDate").value = r.date||"";
  document.getElementById("erNote").value = r.note||"";
  document.getElementById("editRemModal").classList.add("show");
}
function updateRem() {
  var r = data.reminders.filter(function(x){ return x.id===editRemId; })[0];
  if (!r) return;
  r.product = document.getElementById("erProd").value.trim();
  r.date = document.getElementById("erDate").value;
  r.note = document.getElementById("erNote").value;
  save();
  closeModals();
  renderAllRems(); renderToday();
}
function delRem(id) {
  data.reminders = data.reminders.filter(function(r){ return r.id !== id; });
  save();
  renderAllRems();
  renderToday();
}
function viewClientRems(id) {
  var c = data.clients.filter(function(x){ return x.id===id; })[0];
  var rems = data.reminders.filter(function(r){ return r.clientId===id; });
  var lines = [];
  if (c) lines.push(c.name);
  lines.push("");
  if (!rems.length) lines.push("Нагадувань немає");
  else rems.forEach(function(r){ lines.push(r.date + " — " + r.product); });
  alert(lines.join("\n"));
}
